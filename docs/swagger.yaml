  /api/v1/crypto/handshake:
    post:
      consumes:
      - application/json
      description: 'Client sinh cặp khoá X25519, gửi public key lên đây; server trả
        public key ephemeral + session id, hai phía tự dẫn xuất chung một khoá AES-256-GCM.
        Từ lượt sau, body của /chat, /chat/attachments, /conversations* đi trong phong
        bì {v,sid,nonce,ct} kèm header X-KI-Session. Route này LUÔN plaintext (nó
        là thứ dựng nên khoá) và cần Bearer token: phiên mã hoá gắn với user đã đăng
        nhập.'
      parameters:
      - description: public key của client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CryptoHandshakeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.ResponseResource'
            - properties:
                data:
                  $ref: '#/definitions/dtos.CryptoHandshakeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Mở phiên mã hoá payload chat
      tags:
      - crypto
