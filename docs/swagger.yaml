basePath: /
definitions:
  dtos.ChangePasswordRequest:
    properties:
      new_password:
        example: newsecret456
        minLength: 8
        type: string
      old_password:
        example: secret123
        type: string
    required:
    - new_password
    - old_password
    type: object
  dtos.CreateCategoryRequest:
    properties:
      description:
        example: Tài liệu khoa học
        maxLength: 500
        type: string
      name:
        example: Khoa học
        maxLength: 100
        minLength: 1
        type: string
      parent_id:
        example: 1
        type: integer
    required:
    - name
    type: object
  dtos.CreateUserRequest:
    properties:
      avatar:
        example: https://example.com/avatar.png
        type: string
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
      phone:
        example: "+84901234567"
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dtos.LoginUserRequest:
    properties:
      password:
        example: secret123
        type: string
      username:
        example: johndoe
        type: string
    required:
    - password
    - username
    type: object
  dtos.ResponseResource:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      message:
        example: success
        type: string
      status:
        example: true
        type: boolean
    type: object
  dtos.UpdateCategoryRequest:
    properties:
      description:
        example: Tài liệu khoa học
        maxLength: 500
        type: string
      name:
        example: Khoa học
        maxLength: 100
        minLength: 1
        type: string
      parent_id:
        example: 1
        type: integer
    type: object
info:
  contact: {}
  description: Knowledge ingestion service
  title: Knowledge Ingestion API
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Verifies the old password then sets a new one; all previously issued
        tokens are invalidated immediately
      parameters:
      - description: passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Change my password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Verifies credentials and returns a JWT for calling protected APIs
        via Authorization: Bearer'
      parameters:
      - description: credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Login with username and password
      tags:
      - auth
  /api/v1/auth/profile:
    get:
      description: Returns the profile of the user identified by the JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Get my profile
      tags:
      - auth
  /api/v1/categories:
    get:
      description: Returns my taxonomy tree with total count
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: List my categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Creates a new taxonomy category, optionally under a parent
      parameters:
      - description: category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - categories
  /api/v1/categories/{id}:
    delete:
      description: Deletes a category that has no children
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - categories
    get:
      description: Returns a single category or 404
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Get a category by id
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Partial update — only sent fields change
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Update a category
      tags:
      - categories
  /api/v1/ping:
    get:
      description: Returns pong with server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Ping the server
      tags:
      - health
  /api/v1/pong:
    get:
      description: Returns ping with server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Pong the server
      tags:
      - health
  /api/v1/uploads/presign:
    post:
      consumes:
      - multipart/form-data
      description: Signs a temporary PUT URL so the client can upload the file straight
        to storage without going through this server. Reads the multipart stream part
        by part — only the file name and first 512 sniff bytes are kept, the rest
        is never buffered or stored
      parameters:
      - description: file whose name is used for the presign (body is never stored)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Get a presigned upload URL
      tags:
      - files
  /api/v1/uploads/presign/batch:
    post:
      consumes:
      - multipart/form-data
      description: Signs temporary PUT URLs for up to 20 files in one call, returned
        in the same order as the request. Reads the multipart stream part by part
        — only file names and first 512 sniff bytes are kept, the rest is never buffered
        or stored
      parameters:
      - description: 'files to presign (field name '
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Get presigned upload URLs for multiple files
      tags:
      - files
  /api/v1/users:
    get:
      description: Returns all users with total count
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Hashes the password and creates a new user
      parameters:
      - description: user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Create a new user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT, e.g. "Bearer eyJhbGciOi..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
