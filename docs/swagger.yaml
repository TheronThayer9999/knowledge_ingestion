basePath: /
definitions:
  dtos.CreateUserRequest:
    properties:
      avatar:
        example: https://example.com/avatar.png
        type: string
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        minLength: 8
        type: string
      phone:
        example: "+84901234567"
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dtos.ResponseResource:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      message:
        example: success
        type: string
      status:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: Knowledge ingestion service
  title: Knowledge Ingestion API
  version: "1.0"
paths:
  /api/v1/ping:
    get:
      description: Returns pong with server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Ping the server
      tags:
      - health
  /api/v1/pong:
    get:
      description: Returns ping with server timestamp
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Pong the server
      tags:
      - health
  /api/v1/uploads/presign:
    post:
      consumes:
      - multipart/form-data
      description: Signs a temporary PUT URL so the client can upload the file straight
        to storage without going through this server. The file itself is NOT stored
        — only its name is read and content type sniffed from the multipart part to
        derive the key and sign the content type
      parameters:
      - description: file whose name is used for the presign (body is never stored)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Get a presigned upload URL
      tags:
      - files
  /api/v1/uploads/presign/batch:
    post:
      consumes:
      - multipart/form-data
      description: Signs temporary PUT URLs for up to 20 files in one call, returned
        in the same order as the request. Files are NOT stored — only their names
        are read and content types sniffed from the multipart parts to derive keys
        and sign content types
      parameters:
      - description: files to presign (field name \
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Get presigned upload URLs for multiple files
      tags:
      - files
  /api/v1/users:
    get:
      description: Returns all users with total count
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: List all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Hashes the password and creates a new user
      parameters:
      - description: user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Create a new user
      tags:
      - users
swagger: "2.0"
