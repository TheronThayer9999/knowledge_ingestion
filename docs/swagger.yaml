          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      summary: Create a new user
      tags:
      - users
  /health:
    get:
      description: Kiểm tra postgres, qdrant, seaweedfs, rabbitmq. Trả 200 nếu tất
        cả OK, 503 nếu có thành phần chết.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "503":
