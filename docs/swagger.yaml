  /api/v1/search:
    post:
      consumes:
      - application/json
      description: Embed câu hỏi rồi tìm đoạn gần nhất trong phạm vi bài của chính
        mình (kèm category_id để khoanh chủ đề). Chỉ trả hit thuộc bài đã embed done.
      parameters:
      - description: search query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Search knowledge chunks
      tags:
      - search
  /api/v1/uploads/presign:
    post:
      consumes:
      - multipart/form-data
      description: Signs a temporary PUT URL so the client can upload the file straight
        to storage without going through this server. Reads the multipart stream part
        by part — only the file name and first 512 sniff bytes are kept, the rest
        is never buffered or stored
      parameters:
      - description: file whose name is used for the presign (body is never stored)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Get a presigned upload URL
      tags:
      - files
  /api/v1/uploads/presign/batch:
    post:
      consumes:
      - multipart/form-data
      description: Signs temporary PUT URLs for up to 20 files in one call, returned
        in the same order as the request. Reads the multipart stream part by part
        — only file names and first 512 sniff bytes are kept, the rest is never buffered
        or stored
      parameters:
      - description: 'files to presign (field name '
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ResponseResource'
      security:
      - BearerAuth: []
      summary: Get presigned upload URLs for multiple files
      tags:
      - files
  /api/v1/users:
    get:
