syntax = "proto3";

package knowledge.v1;

option go_package = "knowledge_ingestion/src/controller/grpchandler/gen;gen";

// KnowledgeService là contract duy nhất cho AI agent (Python hay Go) gọi qua
// gRPC — mọi nghiệp vụ vẫn do service Go làm, handler gRPC chỉ map
// proto <-> DTO và Result <-> grpc status, mỏng như controller gin.
// Auth: metadata "authorization: Bearer <JWT>" (token lấy từ POST
// /auth/login qua HTTP); trace: metadata "x-trace-id" (trống thì server tự
// sinh, trả về trong response metadata "x-trace-id").
service KnowledgeService {
  // Search embed câu hỏi rồi tìm đoạn gần nhất trong phạm vi bài của chính
  // mình — tương đương POST /api/v1/search.
  rpc Search(SearchRequest) returns (SearchResponse);
  // RebuildVectors đưa bài về hàng đợi chunk→embed từ đầu — tương đương
  // POST /api/v1/admin/rebuild-vectors. Scope bắt buộc đúng 1 trong
  // article_ids hoặc category_id.
  rpc RebuildVectors(RebuildVectorsRequest) returns (RebuildVectorsResponse);
}

message SearchRequest {
  string query = 1;
  int64 category_id = 2;
  int32 limit = 3;
  float score_threshold = 4;
}

message SearchHit {
  int64 article_id = 1;
  int32 chunk_index = 2;
  int32 page_num = 3;
  float score = 4;
  string text = 5;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  int32 total = 2;
}

message RebuildVectorsRequest {
  repeated int64 article_ids = 1;
  int64 category_id = 2;
}

message RebuildVectorsResponse {
  int64 reset_articles = 1;
  repeated int64 article_ids = 2;
}
