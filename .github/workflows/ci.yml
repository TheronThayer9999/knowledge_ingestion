name: CI (Go)

# Chỉ chạy khi thay đổi ảnh hưởng tới backend Go. Thay đổi thuần frontend
# (knowledge_ingestion_fe/**), markdown, plan, dữ liệu mẫu... KHÔNG kéo Go
# build/test lại nữa — xem ci-fe.yml cho luồng Angular.
on:
  push:
    branches: [master]
    paths:
      - 'cmd/**'
      - 'src/**'
      - 'schema/**'
      - 'configs/**'
      - 'prompts/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'src/**'
      - 'schema/**'
      - 'configs/**'
      - 'prompts/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  # đổi đường dẫn ở trên mà vẫn muốn chạy: bấm Run workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
