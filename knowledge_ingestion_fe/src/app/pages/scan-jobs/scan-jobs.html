<div class="scan-page">
  <header class="page-head">
    <h2 class="page-title">{{ lang.t('SCAN_JOBS_TITLE') }}</h2>
    <p class="page-subtitle">{{ lang.t('SCAN_JOBS_SUBTITLE') }}</p>
  </header>

  <mat-tab-group
    class="scan-tabs"
    animationDuration="150ms"
    [selectedIndex]="store.tabIndex()"
    (selectedIndexChange)="store.showTab($event)"
  >
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label">
          <mat-icon aria-hidden="true">upload_file</mat-icon>
          {{ lang.t('SCAN_TAB_DOCUMENTS') }}
        </span>
      </ng-template>
      <ng-template matTabContent>
        <app-documents-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label">
          <mat-icon aria-hidden="true">fact_check</mat-icon>
          {{ lang.t('SCAN_TAB_REVIEW') }}
        </span>
      </ng-template>
      <ng-template matTabContent>
        <app-review-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label">
          <mat-icon aria-hidden="true">picture_as_pdf</mat-icon>
          {{ lang.t('SCAN_TAB_OUTPUT') }}
        </span>
      </ng-template>
      <ng-template matTabContent>
        <app-output-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label">
          <mat-icon aria-hidden="true">history</mat-icon>
          {{ lang.t('SCAN_TAB_HISTORY') }}
        </span>
      </ng-template>
      <ng-template matTabContent>
        <app-history-tab />
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
