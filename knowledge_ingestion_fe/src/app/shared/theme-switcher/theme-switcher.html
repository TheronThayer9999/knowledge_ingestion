<button
  matIconButton
  [matMenuTriggerFor]="paletteMenu"
  [attr.aria-label]="lang.t('TOOLBAR_CHANGE_PALETTE')"
>
  <mat-icon>palette</mat-icon>
</button>

<mat-menu #paletteMenu="matMenu">
  @for (palette of palettes; track palette) {
    <button mat-menu-item (click)="theme.setPalette(palette)">
      <mat-icon [class.invisible]="theme.palette() !== palette">check</mat-icon>
      <span>{{ lang.t(paletteKey(palette)) }}</span>
    </button>
  }
</mat-menu>

<button matIconButton (click)="theme.toggleMode()" [attr.aria-label]="lang.t(modeLabelKey())">
  <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
</button>
