<mat-toolbar color="primary" class="top-bar">
  <mat-icon>library_books</mat-icon>
  <span class="top-bar__title">{{ lang.t('APP_NAME') }}</span>

  <span class="top-bar__spacer"></span>

  <!-- Menu chọn ngôn ngữ runtime -->
  <button mat-button [matMenuTriggerFor]="langMenu">
    <mat-icon>translate</mat-icon>
    <span>{{ lang.lang().toUpperCase() }}</span>
  </button>
  <mat-menu #langMenu="matMenu">
    @for (opt of lang.langs; track opt.code) {
      <button
        mat-menu-item
        [class.top-bar__active-theme]="lang.lang() === opt.code"
        (click)="lang.setLang(opt.code)"
      >
        <mat-icon>{{ lang.lang() === opt.code ? 'check' : 'circle' }}</mat-icon>
        <span>{{ opt.label }}</span>
      </button>
    }
  </mat-menu>

  <!-- Switcher theme: menu liệt kê từ AVAILABLE_THEMES, thêm theme mới tự xuất hiện -->
  <button mat-button [matMenuTriggerFor]="themeMenu">
    <mat-icon>palette</mat-icon>
    <span>{{ lang.t('THEME_LABEL') }}</span>
  </button>
  <mat-menu #themeMenu="matMenu">
    @for (theme of themes; track theme.name) {
      <button
        mat-menu-item
        [class.top-bar__active-theme]="themeService.theme() === theme.name"
        (click)="selectTheme(theme.name)"
      >
        <mat-icon>{{ themeService.theme() === theme.name ? 'check' : 'circle' }}</mat-icon>
        <span>{{ theme.label }}</span>
      </button>
    }
  </mat-menu>

  @if (auth.user(); as user) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="top-bar__user">
      <mat-icon>account_circle</mat-icon>
      <span>{{ user.displayName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <div mat-menu-item disabled class="top-bar__user-email">{{ user.email }}</div>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ lang.t('TOP_BAR_LOGOUT') }}</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
