<h2 mat-dialog-title>{{ data.title }}</h2>

@if (data.message) {
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions align="end">
  <button matButton [mat-dialog-close]="false">{{ data.cancelLabel }}</button>
  <button matButton="filled" [mat-dialog-close]="true">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
