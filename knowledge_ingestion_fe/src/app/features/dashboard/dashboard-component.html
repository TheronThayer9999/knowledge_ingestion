<div class="dashboard">
  <app-top-bar />

  <main class="dashboard__content">
    <section class="dashboard__stats">
      @for (stat of stats; track stat.label) {
        <mat-card appearance="outlined" class="dashboard__stat-card">
          <mat-card-content>
            <mat-icon class="dashboard__stat-icon">{{ stat.icon }}</mat-icon>
            <div>
              <div class="dashboard__stat-value">{{ stat.value }}</div>
              <div class="dashboard__stat-label">{{ stat.label }}</div>
            </div>
          </mat-card-content>
        </mat-card>
      }
    </section>

    <mat-card appearance="outlined" class="dashboard__table-card">
      <mat-card-header>
        <mat-card-title>Tài liệu gần đây</mat-card-title>
        <mat-card-subtitle>Chào {{ auth.user()?.displayName }} — phiên đăng nhập đang hoạt động</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="recentArticles" class="dashboard__table">
          @for (col of columns; track col) {
            <ng-container [matColumnDef]="col">
              <th mat-header-cell *matHeaderCellDef>{{ col }}</th>
              <td mat-cell *matCellDef="let article">{{ article[col] }}</td>
            </ng-container>
          }
          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </main>
</div>
