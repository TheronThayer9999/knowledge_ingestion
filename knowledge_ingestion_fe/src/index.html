<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Knowledge Ingestion</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Áp theme trước khi Angular boot để tránh nháy màu (FOUC).
    // Cùng storage key/format với ThemeService (src/app/core/theme/theme.service.ts).
    (function () {
      var palettes = ['azure', 'rose-red', 'magenta-violet', 'cyan-orange'];
      var state = null;
      try {
        state = JSON.parse(localStorage.getItem('ki.theme') || 'null');
      } catch (e) {
        state = null;
      }
      var palette = state && palettes.indexOf(state.palette) !== -1 ? state.palette : 'azure';
      var mode = state && (state.mode === 'light' || state.mode === 'dark')
        ? state.mode
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add('theme-' + palette);
      document.documentElement.style.colorScheme = mode;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
