<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Knowledge Ingestion</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Áp theme trước khi Angular boot để tránh nháy màu (FOUC).
      // Danh sách palette KHÔNG khai báo ở đây — nguồn duy nhất là ThemeService
      // (src/app/core/theme/theme.service.ts). Script chỉ kiểm tra định dạng rồi
      // áp class `theme-<palette>`: palette lạ không có rule CSS tương ứng nên
      // :root (azure) vẫn là mặc định, và ThemeService dọn class đó khi boot.
      (function () {
        var state = null;
        try {
          state = JSON.parse(localStorage.getItem('ki.theme') || 'null');
        } catch (e) {
          state = null;
        }
        var palette =
          state && typeof state.palette === 'string' && /^[a-z][a-z-]*$/.test(state.palette)
            ? state.palette
            : 'azure';
        var mode =
          state && (state.mode === 'light' || state.mode === 'dark')
            ? state.mode
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.add('theme-' + palette);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <!-- Font Roboto + Material Icons TỰ HOST qua npm (@fontsource/roboto,
         material-icons) và khai báo trong angular.json > styles. KHÔNG thêm lại
         link Google Fonts vào đây: môi trường chặn CDN sẽ làm mat-icon in ra
         chữ thay vì icon, và CI (ci-fe.yml) đang chặn bằng grep tên host. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
